<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETWORKING MIDTERM | REVIEWER</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'Helvetica Bold', 'Helvetica', 'sans-serif'],
                    },
                    keyframes: {
                        float: {
                            '0%': { transform: 'translate(0, 0) scale(1)' },
                            '100%': { transform: 'translate(50px, 50px) scale(1.1)' }
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Base Setup & Liquid Glass Variables (Retained for JS Slider Support) -->
    <style>
        :root {
            --glass-blur: 16px;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --btn-glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border-top: rgba(255, 255, 255, 0.4);
            --glass-border-left: rgba(255, 255, 255, 0.15);
            --glass-border-right: rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --glass-inner-glow: inset 0 2px 4px rgba(255, 255, 255, 0.15);
            
            --correct-glow: rgba(46, 204, 113, 0.3);
            --incorrect-glow: rgba(231, 76, 60, 0.3);
            --text-color: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="font-sans m-0 p-5 min-h-screen text-[var(--text-color)] bg-[#0f111a] overflow-x-hidden relative">

    <!-- Ambient Orbs -->
    <div class="fixed rounded-full blur-[90px] -z-10 opacity-60 top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-[#1e3c72] animate-[float_12s_ease-in-out_infinite_alternate]"></div>
    <div class="fixed rounded-full blur-[90px] -z-10 opacity-60 bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-[#2a0845] animate-[float_15s_ease-in-out_infinite_alternate-reverse]"></div>

    <header class="text-center mb-10 mt-2.5">
        <h1 class="text-[2.2em] font-bold mb-2.5 drop-shadow-[0_2px_10px_rgba(255,255,255,0.2)] tracking-[-0.5px]">Networking Midterm</h1>
        <p class="text-[var(--text-muted)]">Comprehensive 43-Item Reviewer</p>
    </header>

    <div class="max-w-[750px] mx-auto relative z-10">
        
        <!-- Score Board -->
        <div class="sticky top-5 p-5 md:px-[30px] rounded-[24px] flex flex-col justify-center items-center text-[1.25em] font-bold z-[100] mx-auto mb-[30px] transition-all duration-300 ease-in-out gap-4 w-full md:w-fit min-w-0 md:min-w-[320px] max-w-full text-center bg-[var(--glass-bg)] backdrop-blur-[length:var(--glass-blur)] backdrop-saturate-[120%] border-t border-t-[var(--glass-border-top)] border-l border-l-[var(--glass-border-left)] border-r border-r-[var(--glass-border-right)] border-b border-b-transparent [box-shadow:var(--glass-shadow),var(--glass-inner-glow)]">
            <span id="score-text">Score: 0 / 43 (0%)</span>
            
            <div class="flex items-center justify-center gap-3 text-[0.75em] font-semibold text-[var(--text-color)] bg-white/5 px-5 py-2.5 rounded-full border border-white/20 w-full">
                <span>Glass Intensity</span>
                <input type="range" id="intensity-slider" min="0" max="100" value="50" class="appearance-none w-[120px] bg-white/20 rounded-[10px] h-1.5 outline-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-[0_0_10px_rgba(255,255,255,0.8)] [&::-webkit-slider-thumb]:transition-transform [&::-webkit-slider-thumb]:duration-100 [&::-webkit-slider-thumb]:active:scale-[1.3]">
            </div>

            <button class="bg-white/10 text-white border border-white/20 px-5 py-2.5 text-[0.85em] font-semibold rounded-full cursor-pointer backdrop-blur-[10px] transition-all duration-200 ease-[cubic-bezier(0.25,0.8,0.25,1)] hover:bg-white/20 active:scale-[0.92] active:bg-white/20" onclick="restartQuiz()">Restart Quiz</button>
        </div>
        
        <h2 id="part-1-title" class="text-[1.4em] font-semibold my-10 pb-2.5 border-b border-b-[var(--glass-border-left)] inline-block">Networking Concepts Review</h2>
        <div id="mc-container"></div>
    </div>

    <script>
        const slider = document.getElementById('intensity-slider');
        
        function updateGlassIntensity(value) {
            const multiplier = value / 50; 
            
            document.documentElement.style.setProperty('--glass-blur', `${16 * multiplier}px`);
            document.documentElement.style.setProperty('--glass-bg', `rgba(255, 255, 255, ${0.03 * multiplier})`);
            document.documentElement.style.setProperty('--btn-glass-bg', `rgba(255, 255, 255, ${0.04 * multiplier})`);
            document.documentElement.style.setProperty('--glass-border-top', `rgba(255, 255, 255, ${Math.min(1, 0.4 * multiplier)})`);
            document.documentElement.style.setProperty('--glass-border-left', `rgba(255, 255, 255, ${Math.min(1, 0.15 * multiplier)})`);
            document.documentElement.style.setProperty('--glass-border-right', `rgba(255, 255, 255, ${Math.min(1, 0.05 * multiplier)})`);
            document.documentElement.style.setProperty('--glass-shadow', `0 8px 32px 0 rgba(0, 0, 0, ${0.3 * multiplier})`);
            document.documentElement.style.setProperty('--glass-inner-glow', `inset 0 2px 4px rgba(255, 255, 255, ${Math.min(1, 0.15 * multiplier)})`);
        }

        slider.addEventListener('input', (e) => {
            updateGlassIntensity(e.target.value);
        });
        
        // --- 43 Networking Questions Generated from Reviewer ---
        const mcQuestions = [
            { q: "1. What is the range of numbered standard ACLs?", ans: "A", exp: "The range of numbered standard ACLs is 1-99/1300-1999[cite: 1].", options: { A: "1-99/1300-1999", B: "100-199/2000-2699", C: "1-100", D: "0-255" } },
            { q: "2. Where should you place the configuration of a standard ACL?", ans: "B", exp: "A standard ACL should be placed near the destination network[cite: 1].", options: { A: "Near the source network", B: "Near the destination network", C: "On the core router", D: "On the distribution switch" } },
            { q: "3. Which ACL type can filter based on source, destination, and protocol?", ans: "C", exp: "An Extended ACL can filter based on source, destination, and protocol[cite: 1].", options: { A: "Standard ACL", B: "Named Standard ACL", C: "Extended ACL", D: "Basic ACL" } },
            { q: "4. When a network administrator configures a standard IPv4 ACL, which information does this ACL primarily use to make filtering decisions?", ans: "A", exp: "Standard IPv4 ACLs make filtering decisions based on the source IP address[cite: 1].", options: { A: "Based on source IP address", B: "Based on destination IP address", C: "Based on MAC address", D: "Based on port numbers" } },
            { q: "5. What are the two directions for applying a configuration ACL?", ans: "C", exp: "The two directions for applying a configuration ACL are inbound and outbound[cite: 1].", options: { A: "Inside and outside", B: "Internal and external", C: "Inbound and outbound", D: "Ingress and egress" } },
            { q: "6. What is the purpose of a wildcard mask in ACL configuration?", ans: "B", exp: "The purpose of a wildcard mask is to specify which bits in the IP address should be checked to permit or deny[cite: 1].", options: { A: "Specify the default gateway", B: "Specify which bits in ip address should be checked (permits or deny)", C: "Define the exact subnet mask for the interface", D: "Identify the routing protocol to be used" } },
            { q: "7. Why is a named ACL often preferred over a numbered ACL?", ans: "A", exp: "A named ACL is preferred because it is easier to identify and manage[cite: 1].", options: { A: "Named ACL is easier identify and manage", B: "Named ACL processes packets much faster", C: "Numbered ACLs cannot deny traffic", D: "Numbered ACLs are exclusively for IPv6" } },
            { q: "8. What is the implicit deny rule?", ans: "C", exp: "The implicit deny rule means that all unmatched traffic is denied automatically[cite: 1].", options: { A: "All unmatched traffic is permitted automatically", B: "Unmatched traffic is logged for review", C: "All unmatched traffic is denied automatically", D: "It applies only to Extended ACLs" } },
            { q: "9. Which command is used to view configured ACLs?", ans: "D", exp: "The command to view configured ACLs is 'show access-list'[cite: 1].", options: { A: "show running-config acl", B: "show ip route", C: "show interfaces acl", D: "show access-list" } },
            { q: "10. Which ACL type can filter protocol?", ans: "B", exp: "The Extended ACL type can filter based on protocol[cite: 1].", options: { A: "Standard ACL", B: "Extended ACL", C: "Reflexive ACL", D: "MAC ACL" } },
            { q: "11. What does the keyword 'any' mean in ACL configuration?", ans: "C", exp: "In ACL configuration, the keyword 'any' means any IP address[cite: 1].", options: { A: "A specific host address", B: "Any MAC address", C: "Any IP address", D: "Any configured interface" } },
            { q: "12. In ACL configuration, what does 'host' imply?", ans: "B", exp: "The keyword 'host' means that it has 1 single IP address[cite: 1].", options: { A: "A range of IP addresses", B: "Have 1 single IP address", C: "A default gateway assignment", D: "A wildcard mask of 255.255.255.255" } },
            { q: "13. Which command is used to start a named standard ACL configuration?", ans: "A", exp: "The command used is 'ip access-list standard acl-name'[cite: 1].", options: { A: "ip access-list standard acl-name", B: "access-list standard acl-name", C: "standard access-list acl-name", D: "ip access-group acl-name" } },
            { q: "14. Which wildcard mask matches on exactly one IP address/a single host?", ans: "D", exp: "The wildcard mask that matches a single host is 0.0.0.0[cite: 1].", options: { A: "255.255.255.255", B: "0.0.0.255", C: "255.255.255.0", D: "0.0.0.0" } },
            { q: "15. What command is used when applying an ACL to an interface?", ans: "B", exp: "The command used when applying an ACL to an interface is 'ip access-group'[cite: 1].", options: { A: "ip access-list", B: "ip access-group", C: "access-class", D: "interface access-list" } },
            { q: "16. What is the proper way to remove/delete an ACL from an interface?", ans: "C", exp: "The command to remove an ACL from the interface is 'no ip access-group'[cite: 1].", options: { A: "delete access-group", B: "remove access-list", C: "no ip access-group", D: "clear ip access-list" } },
            { q: "17. To configure ACL no. 10 inbound on interface g0/0, what command should you use?", ans: "A", exp: "The command is 'ip access-group 10 in'[cite: 1].", options: { A: "ip access-group 10 in", B: "access-group 10 in", C: "ip access-list 10 inbound", D: "apply acl 10 inbound" } },
            { q: "18. Why should ACL rules be arranged carefully?", ans: "B", exp: "Rules should be arranged carefully to avoid permitting or denying traffic unintentionally[cite: 1].", options: { A: "To keep the router's memory usage low", B: "To avoid to permit or deny unintentionally the traffic", C: "Because the IOS requires alphabetical ordering", D: "To reduce CPU temperature spikes" } },
            { q: "19. What does the command 'access-list 10 deny any' do?", ans: "D", exp: "It blocked all traffic / serves as the implicit deny rule[cite: 1].", options: { A: "Permits all traffic implicitly", B: "Deletes ACL 10 from the router", C: "Logs all dropped packets for ACL 10", D: "Blocked all traffic / implicit deny rule" } },
            { q: "20. What is the main limitation of a standard ACL?", ans: "A", exp: "The main limitation is that it only uses the source IP to filter traffic[cite: 1].", options: { A: "Source IP to filter traffic", B: "It can only filter UDP packets", C: "It cannot deny traffic", D: "It can only be applied to loopback interfaces" } },
            { q: "21. What command is used to delete an entire numbered ACL?", ans: "C", exp: "The command to delete a numbered ACL is 'no access-list'[cite: 1].", options: { A: "delete access-list", B: "remove access-list", C: "no access-list", D: "clear access-list" } },
            { q: "22. Which wildcard mask matches the subnet 192.168.10.0/24?", ans: "B", exp: "The wildcard mask for a /24 subnet is 0.0.0.255[cite: 1].", options: { A: "255.255.255.0", B: "0.0.0.255", C: "0.0.0.0", D: "255.255.255.255" } },
            { q: "23. An administrator wants to permit traffic from only host 192.168.1.25 using standard ACL 5. Which command could identify that host?", ans: "C", exp: "The command is 'access-list 5 permit host 192.168.1.25'[cite: 1].", options: { A: "access-list 5 permit 192.168.1.25 0.0.0.255", B: "ip access-group 5 permit 192.168.1.25", C: "access-list 5 permit host 192.168.1.25", D: "permit host 192.168.1.25 acl 5" } },
            { q: "24. A network administrator wants to permit all hosts in the 192.168.10.0/24 subnet using standard ACL 10. What command should be used?", ans: "D", exp: "The command is 'access-list 10 permit 192.168.10.0 0.0.0.255'[cite: 1].", options: { A: "access-list 10 permit 192.168.10.0 255.255.255.0", B: "access-list 10 permit any 192.168.10.0", C: "ip access-list 10 permit 192.168.10.0", D: "access-list 10 permit 192.168.10.0 0.0.0.255" } },
            { q: "25. Why are ACLs important for network security?", ans: "A", exp: "They control or restrict network access depending on the rule to deny or permit[cite: 1].", options: { A: "Control or restrict network access depends on rule to deny or permit", B: "They encrypt data packets securely", C: "They provide built-in antivirus protection", D: "They prevent physical hardware theft" } },
            { q: "26. What is the default action/configuration at the end of each ACL?", ans: "B", exp: "The default configuration is 'deny any'[cite: 1].", options: { A: "permit any", B: "deny any", C: "log any", D: "redirect any" } },
            { q: "27. Which ACL type offers detailed control when filtering traffic?", ans: "C", exp: "The Extended ACL has many controls when filtering traffic[cite: 1].", options: { A: "Standard ACL", B: "Named Standard ACL", C: "Extended ACL", D: "Reflexive ACL" } },
            { q: "28. Which command displays configured ACLs regardless of whether they are standard or extended?", ans: "D", exp: "The commands are 'show access-list' or 'show ip access-list'[cite: 1].", options: { A: "show run acl", B: "show interfaces acl", C: "show ip route acl", D: "show access-list / show ip access-list" } },
            { q: "29. In the context of an ACL, what is an ACE?", ans: "A", exp: "An ACE is an individual rule inside an ACL / statement[cite: 1].", options: { A: "Individual rule inside ACL / statement", B: "Access Control Encryption", C: "Access Command Environment", D: "A dynamic routing protocol feature" } },
            { q: "30. What is the syntax/command structure to create a numbered standard ACL?", ans: "B", exp: "The command is 'access-list [ACL number] permit or deny [source id] [wildcard mask]'[cite: 1].", options: { A: "ip access-list [number]", B: "access-list ACL number permits or deny source id wildcard mask", C: "create acl [number] permit/deny", D: "access-group [number]" } },
            { q: "31. What command is used to establish telnet connections on vty lines?", ans: "C", exp: "The command used to establish telnet connections is 'transport input telnet'[cite: 2].", options: { A: "line vty 0 4", B: "enable telnet", C: "transport input telnet", D: "ip telnet enable" } },
            { q: "32. Which method of modifying an ACL allows a network administrator to insert, delete, or re-order specific ACEs?", ans: "D", exp: "Using a sequence number allows inserting, deleting, or re-ordering a specific ACE[cite: 2].", options: { A: "Line number", B: "Interface group", C: "Priority index", D: "Sequence number" } },
            { q: "33. What is the primary purpose of NAT?", ans: "A", exp: "The primary purpose is to translate private IP into public IP addresses[cite: 2].", options: { A: "Translate private ip into public ip addresses", B: "Encrypt network traffic securely", C: "Assign IP addresses to hosts dynamically", D: "Block malicious internet traffic" } },
            { q: "34. Why is there a need to translate addresses using NAT?", ans: "B", exp: "The primary use of NAT translation is to conserve public IPv4 addresses[cite: 2].", options: { A: "To increase internet bandwidth speed", B: "To conserve public ipv4 addresses", C: "To bypass external firewalls", D: "To fully implement IPv6 integration" } },
            { q: "35. Which type of NAT uses a fixed mapping?", ans: "C", exp: "Static NAT uses a fixed mapping[cite: 2].", options: { A: "Dynamic NAT", B: "PAT", C: "Static NAT", D: "NAT Overload" } },
            { q: "36. Which RFC 1918 private IPv4 address range belongs to Class C?", ans: "B", exp: "The Class C RFC 1918 range is 192.168.0.0/16[cite: 2].", options: { A: "10.0.0.0/8", B: "192.168.0.0/16", C: "172.16.0.0/12", D: "169.254.0.0/16" } },
            { q: "37. Which command is used to verify NAT operations?", ans: "A", exp: "To verify NAT operations, use the 'show ip NAT translation' command[cite: 2].", options: { A: "show ip NAT translation", B: "show ip route", C: "show nat info", D: "show interfaces nat" } },
            { q: "38. A computer has an IP address of 192.168.1.10 within a private network. According to NAT terminology, which term describes this address location relative to the NAT device?", ans: "D", exp: "This address location relative to the NAT device is described as a local address[cite: 2].", options: { A: "Global address", B: "Public address", C: "Outside address", D: "Local address" } },
            { q: "39. An external web server has a publicly visible IP address of 203.0.113.10. According to NAT terminologies, what is it?", ans: "C", exp: "According to NAT terminologies, a publicly visible address is a global address[cite: 2].", options: { A: "Local address", B: "Inside address", C: "Global address", D: "Private address" } },
            { q: "40. Which type of NAT uses a pool of IP addresses?", ans: "B", exp: "Dynamic NAT uses pool IP addresses[cite: 2].", options: { A: "Static NAT", B: "Dynamic NAT", C: "PAT", D: "NAT Overload" } },
            { q: "41. What is another name for PAT (Port Address Translation)?", ans: "A", exp: "PAT is also referred to as NAT overload[cite: 2].", options: { A: "NAT overload", B: "Static NAT", C: "Dynamic NAT", D: "Port forwarding" } },
            { q: "42. Which IOS command is used to configure a static NAT translation that maps an inside local IP address to a specific inside global IP address?", ans: "C", exp: "The command is 'ip nat inside source static'[cite: 2].", options: { A: "ip nat pool", B: "ip nat inside source dynamic", C: "ip nat inside source static", D: "ip nat outside source" } },
            { q: "43. Which of the following correctly lists the 5 logical topology designs of a WAN?", ans: "B", exp: "The 5 logical topologies are Point-to-Point topology, Hub-and-Spoke, Full Mesh, Dual-homed Topology, and Partially Mesh[cite: 2].", options: { A: "Ring, Star, Bus, Mesh, Tree", B: "Point-to-Point topology, Hub-and-Spoke, Full Mesh, Dual-homed Topology, Partially Mesh", C: "Core, Distribution, Access, Edge, WAN", D: "Static, Dynamic, Default, Floating, Backup" } }
        ];

        let currentScore = 0;
        let answeredQuestions = 0;
        const totalQuestions = mcQuestions.length;

        function updateScore() {
            const percentage = Math.round((currentScore / totalQuestions) * 100);
            document.getElementById('score-text').innerText = `Score: ${currentScore} / ${totalQuestions} (${percentage}%)`;
        }

        function restartQuiz() {
            currentScore = 0;
            answeredQuestions = 0;
            
            document.getElementById('mc-container').innerHTML = '';
            createQuiz(mcQuestions, 'mc-container');
            
            updateScore();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function createQuiz(questions, containerId) {
            const container = document.getElementById(containerId);
            const liquidGlassClasses = 'bg-[var(--glass-bg)] backdrop-blur-[length:var(--glass-blur)] backdrop-saturate-[120%] border-t border-t-[var(--glass-border-top)] border-l border-l-[var(--glass-border-left)] border-r border-r-[var(--glass-border-right)] border-b border-b-transparent [box-shadow:var(--glass-shadow),var(--glass-inner-glow)]';
            const btnBaseClasses = 'option-btn bg-[var(--btn-glass-bg)] backdrop-blur-[length:var(--glass-blur)] backdrop-saturate-[120%] border-t border-t-[var(--glass-border-top)] border-l border-l-[var(--glass-border-left)] border-r border-r-transparent border-b border-b-transparent text-[var(--text-color)] px-5 py-4 text-[1.05em] font-medium text-left rounded-[16px] cursor-pointer transition-all duration-300 ease-[cubic-bezier(0.25,0.8,0.25,1)] hover:-translate-y-[2px] hover:bg-white/10 hover:[box-shadow:0_10px_20px_rgba(0,0,0,0.2),var(--glass-inner-glow)] active:scale-[0.96] active:bg-white/15 active:[box-shadow:0_2px_10px_rgba(0,0,0,0.1)] disabled:cursor-default disabled:hover:translate-y-0 disabled:hover:bg-[var(--btn-glass-bg)] disabled:hover:shadow-none disabled:active:scale-100 disabled:active:bg-[var(--btn-glass-bg)] disabled:active:shadow-none'.split(' ');
            
            const correctClasses = ['!bg-[#2ecc71]/20', '!border-t-[#2ecc71]/60', '!border-l-[#2ecc71]/30', '![box-shadow:0_0_20px_var(--correct-glow),var(--glass-inner-glow)]', '!drop-shadow-[0_1px_4px_rgba(0,0,0,0.5)]'];
            const incorrectClasses = ['!bg-[#e74c3c]/20', '!border-t-[#e74c3c]/60', '!border-l-[#e74c3c]/30', '![box-shadow:0_0_20px_var(--incorrect-glow),var(--glass-inner-glow)]', '!drop-shadow-[0_1px_4px_rgba(0,0,0,0.5)]', 'opacity-70'];

            questions.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `rounded-[24px] p-5 md:p-[30px] mb-[30px] ${liquidGlassClasses}`;
                
                const questionText = document.createElement('div');
                questionText.className = 'text-[1.2em] font-medium mb-[25px] leading-relaxed drop-shadow-[0_1px_2px_rgba(0,0,0,0.5)]';
                questionText.innerText = item.q;
                card.appendChild(questionText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'grid grid-cols-1 gap-3 mb-[15px]';

                for (const [key, value] of Object.entries(item.options)) {
                    const btn = document.createElement('button');
                    btn.classList.add(...btnBaseClasses);
                    btn.innerText = `${key}. ${value}`;
                    
                    btn.onclick = function() {
                        const allBtns = optionsGrid.querySelectorAll('.option-btn');
                        allBtns.forEach(b => b.disabled = true);

                        if (key === item.ans) {
                            btn.classList.add(...correctClasses);
                            currentScore++;
                        } else {
                            btn.classList.add(...incorrectClasses);
                            allBtns.forEach(b => {
                                if (b.innerText.startsWith(item.ans)) {
                                    b.classList.add(...correctClasses);
                                }
                            });
                        }
                        
                        expBox.classList.remove('hidden');
                        expBox.classList.add('block');
                        answeredQuestions++;
                        updateScore();
                    };
                    optionsGrid.appendChild(btn);
                }
                card.appendChild(optionsGrid);

                const expBox = document.createElement('div');
                expBox.className = 'hidden mt-5 p-5 rounded-[16px] bg-black/30 border-l-4 border-[#2ecc71] animate-[slideDown_0.4s_cubic-bezier(0.175,0.885,0.32,1.275)]';
                expBox.innerHTML = `<div class="font-bold text-[#2ecc71] mb-2 tracking-[0.5px]">Explanation:</div>${item.exp}`;
                card.appendChild(expBox);

                container.appendChild(card);
            });
        }

        window.onload = () => {
            updateGlassIntensity(slider.value);
            createQuiz(mcQuestions, 'mc-container');
            updateScore();
        };
    </script>
</body>
</html>
