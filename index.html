<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking & Security Quiz</title>
    <style>
        /* CSS Reset & Variables based on image_725bc6.png */
        :root {
            --bg-color: #171926;
            --pill-bg: #0f111a;
            --card-bg: #1c2033;
            --border-color: #2c314a;
            --text-main: #ffffff;
            --text-muted: #797f9e;
            --accent-green: #00e676;
            --accent-red: #ff4d4f;
            --btn-inactive: #23273a;
            --btn-active: #4a5482;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobile First App Container */
        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile width constraint */
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header Pill */
        .top-header {
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: center;
        }

        .user-pill {
            background-color: var(--pill-bg);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 100%;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .user-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Progress Bar Section */
        .progress-section {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .progress-bar-bg {
            flex-grow: 1;
            background-color: var(--border-color);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: var(--accent-green);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease-in-out;
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            padding: 10px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        /* Options List */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            padding: 18px 15px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #252a42;
            border-color: #3f466b;
        }

        .option-btn.selected {
            border-color: var(--text-muted);
            background-color: #282d45;
        }

        .option-btn.correct {
            border-color: var(--accent-green);
            background-color: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
        }

        .option-btn.incorrect {
            border-color: var(--accent-red);
            background-color: rgba(255, 77, 79, 0.1);
            color: var(--accent-red);
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255,255,255,0.05);
            border-left: 4px solid var(--accent-green);
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-box span {
            font-weight: bold;
            color: var(--accent-green);
            display: block;
            margin-bottom: 5px;
        }

        /* Bottom Footer Action */
        .bottom-footer {
            padding: 20px;
            background-color: var(--bg-color);
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .action-btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background-color: var(--btn-inactive);
            color: var(--text-muted);
        }

        .action-btn.ready {
            background-color: var(--btn-active);
            color: var(--text-main);
        }

        .action-btn.next {
            background-color: var(--accent-green);
            color: var(--pill-bg);
        }

        /* End Screen Elements */
        .end-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .end-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-green);
        }
        
        .end-screen p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header Profile Pill -->
        <header class="top-header">
            <div class="user-pill">
                <div class="user-info">
                    <span>🌐</span>
                    <span>IT Security</span>
                </div>
                <div class="user-stats">
                    <div class="stats-item">
                        ⭐ <span id="score-display">0</span>
                    </div>
                    <!-- View Counter integrated seamlessly -->
                    <div class="stats-item">
                        <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fnetworking-security-quiz-app.local&count_bg=%230f111a&title_bg=%230f111a&icon=&icon_color=%23E7E7E7&title=👀&edge_flat=true" alt="Views"/>
                    </div>
                </div>
            </div>
        </header>

        <!-- Quiz Interface -->
        <div id="quiz-interface" style="display: flex; flex-direction: column; flex-grow: 1;">
            
            <div class="progress-section">
                <!-- X Button to restart -->
                <button class="close-btn" onclick="restartQuiz()">✕</button>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>

            <main class="main-content">
                <div class="question-text" id="question-text">Loading question...</div>
                
                <div class="options-container" id="options-container">
                    <!-- Buttons generated by JS -->
                </div>

                <div class="explanation-box" id="explanation-box"></div>
            </main>

            <footer class="bottom-footer">
                <button class="action-btn" id="action-btn" disabled onclick="handleAction()">CHECK</button>
            </footer>

        </div>

        <!-- End Screen Interface -->
        <div id="end-screen" class="main-content end-screen">
            <h1>Quiz Complete!</h1>
            <p>You scored <span id="final-score" style="color: white; font-weight: bold;">0</span> out of <span id="total-qs" style="color: white; font-weight: bold;">50</span>.</p>
            <button class="action-btn ready" onclick="restartQuiz()">RESTART QUIZ</button>
        </div>

    </div>

    <script>
        // Combined Array of all 50 Questions (MC + TF)
        const allQuestions = [
            // PART I. Multiple Choice
            { q: "What type of routing protocol is OSPF?", ans: "C", exp: "Open Shortest Path First (OSPF) is an Interior Gateway Protocol (IGP) that relies on the link-state routing algorithm to create a complete topological map of the network.", options: { A: "Distance vector", B: "Path vector", C: "Link-state", D: "Hybrid" } },
            { q: "What does OSPF use to uniquely identify an OSPF router?", ans: "C", exp: "In an OSPF domain, every router requires a unique 32-bit identifier called a Router ID.", options: { A: "MAC Address", B: "Process ID", C: "Router ID", D: "Area ID" } },
            { q: "Which OSPF packet is used to discover neighbors and establish neighbor adjacencies?", ans: "D", exp: "The OSPF Hello packet is sent periodically out of all OSPF-enabled interfaces to discover other OSPF routers.", options: { A: "Database Description", B: "Link-State Request", C: "Link-State Update", D: "Hello" } },
            { q: "Which OSPF packet contains link-state advertisements?", ans: "D", exp: "Link-State Update (LSU) packets are used to reply to Link-State Requests and announce new information.", options: { A: "Hello", B: "Database Description", C: "Link-State Acknowledgment", D: "Link-State Update" } },
            { q: "What is the purpose of the OSPF Hello packet?", ans: "B", exp: "Hello packets are explicitly designed to find neighboring routers on the same network segment.", options: { A: "Update routing tables", B: "Discover neighbors and establish adjacencies", C: "Request missing LSAs", D: "Acknowledge receipt of an LSU" } },
            { q: "Which security principle ensures that only authorized users can access information?", ans: "C", exp: "Confidentiality ensures that sensitive data is kept private and is not disclosed to unauthorized individuals.", options: { A: "Integrity", B: "Availability", C: "Confidentiality", D: "Authentication" } },
            { q: "Which security principle ensures that data has not been altered without authorization?", ans: "D", exp: "Integrity guarantees that information is accurate, complete, and has not been modified or corrupted.", options: { A: "Confidentiality", B: "Availability", C: "Non-repudiation", D: "Integrity" } },
            { q: "Which security principle ensures that authorized users can access information when needed?", ans: "C", exp: "Availability ensures that network systems, data, and applications are accessible and operational.", options: { A: "Integrity", B: "Confidentiality", C: "Availability", D: "Authorization" } },
            { q: "What is a firewall primarily used for?", ans: "A", exp: "A firewall is a network security device that monitors network traffic and allows or blocks specific traffic.", options: { A: "Controlling and filtering network traffic", B: "Routing packets between networks", C: "Providing remote access", D: "Encrypting wireless data" } },
            { q: "Why is network security implemented in multiple layers?", ans: "D", exp: "This is 'Defense in Depth.' If an attacker bypasses one layer, subsequent layers provide backup protection.", options: { A: "To increase network speed", B: "To reduce hardware costs", C: "To simplify management", D: "To provide multiple levels of protection" } },
            { q: "An organization wants to protect its network from both external attackers and internal misuse. Which approach is strongest?", ans: "D", exp: "Layered security (Defense in Depth) ensures protection from diverse attack vectors.", options: { A: "Install a single firewall", B: "Train employees annually", C: "Use strong passwords", D: "Use multiple controls at different layers" } },
            { q: "What is an asset in an organization?", ans: "B", exp: "In cybersecurity, an asset is any physical or digital entity that has value and needs protection.", options: { A: "Physical servers only", B: "Anything of value to the organization", C: "Digital data only", D: "Network cables" } },
            { q: "This protocol provides a secure remote access connection to network devices.", ans: "B", exp: "Secure Shell (SSH) provides a secure, encrypted alternative to unencrypted protocols like Telnet.", options: { A: "Telnet", B: "SSH", C: "FTP", D: "HTTP" } },
            { q: "Which type of cyberattack secretly intercepts and alters communication between two parties?", ans: "C", exp: "In a Man-in-the-Middle (MitM) attack, the perpetrator eavesdrops on or manipulates the traffic.", options: { A: "Denial of Service", B: "Phishing", C: "Man-in-the-Middle attack", D: "Ransomware" } },
            { q: "Which type of cyberattack uses trial-and-error to systematically guess login credentials?", ans: "B", exp: "A brute-force attack involves attempting every possible combination of a password until successful.", options: { A: "SQL Injection", B: "Brute-Force Attack", C: "Cross-Site Scripting", D: "Spoofing" } },
            { q: "Which type of cyberattack tricks individuals into revealing sensitive information?", ans: "C", exp: "Phishing uses social engineering via deceptive emails or websites to manipulate users.", options: { A: "Malware", B: "DDoS", C: "Phishing Attack", D: "Zero-day exploit" } },
            { q: "Which type of hackers are ethical professionals who use their skills for legal purposes?", ans: "C", exp: "White hat hackers are authorized security professionals who patch flaws before malicious attackers exploit them.", options: { A: "Gray Hat", B: "Red Hat", C: "White Hat", D: "Black Hat" } },
            { q: "Which type of hackers are unethical criminals who compromise security for malicious purposes?", ans: "C", exp: "Black hat hackers illegally bypass security protocols for financial gain or data theft.", options: { A: "White Hat", B: "Gray Hat", C: "Black Hat", D: "Green Hat" } },
            { q: "What is the wildcard mask for the subnet mask 255.255.255.192?", ans: "B", exp: "Subtracting 255.255.255.192 from 255.255.255.255 gives 0.0.0.63.", options: { A: "0.0.0.31", B: "0.0.0.63", C: "0.0.0.127", D: "0.0.0.255" } },
            { q: "A network uses the subnet mask /27. What is its corresponding wildcard mask?", ans: "C", exp: "A /27 prefix is 255.255.255.224. Subtracting this from 255.255.255.255 gives 0.0.0.31.", options: { A: "0.0.0.15", B: "0.0.0.63", C: "0.0.0.31", D: "0.0.0.7" } },
            { q: "What is the wildcard mask for the subnet mask /22?", ans: "C", exp: "A /22 is 255.255.252.0. Subtracting from 255.255.255.255 gives 0.0.3.255.", options: { A: "0.0.1.255", B: "0.0.7.255", C: "0.0.3.255", D: "0.0.15.255" } },
            { q: "Which OSPF network type requires a Designated Router and Backup Designated Router?", ans: "B", exp: "In multiaccess networks (like Ethernet), a DR and BDR reduce OSPF traffic overhead.", options: { A: "Point-to-Point", B: "Multiaccess", C: "Non-Broadcast", D: "Point-to-Multipoint" } },
            { q: "What is the primary role of the Designated Router in a multiaccess OSPF network?", ans: "A", exp: "The DR acts as a central collection and distribution point for Link-State Advertisements (LSAs).", options: { A: "Collect and distribute LSAs", B: "Forward data packets", C: "Maintain the routing table", D: "Establish adjacencies with all" } },
            { q: "Why is a BDR elected in a multiaccess OSPF network?", ans: "A", exp: "The Backup Designated Router listens to routing updates to immediately become the DR if it goes offline.", options: { A: "To take over if the DR fails", B: "To balance the DR load", C: "To connect to other areas", D: "To filter LSAs" } },
            { q: "Which statement best describes an LSU and an LSA?", ans: "A", exp: "A Link-State Update (LSU) is a packet type that acts as an envelope to carry one or multiple LSAs.", options: { A: "An LSU can contain one or more LSAs", B: "An LSA can contain one or more LSUs", C: "They are the same thing", D: "LSAs are only for multiaccess" } },
            { q: "Why must neighboring OSPF routers have matching Hello parameters?", ans: "A", exp: "Hello interval, Dead interval, Area ID, and authentication settings must match exactly to form an adjacency.", options: { A: "To establish an adjacency", B: "To elect a DR", C: "To share the routing table", D: "To calculate shortest path" } },
            { q: "A network administrator wants to identify a specific OSPF router. Which value should be examined?", ans: "C", exp: "The 32-bit Router ID uniquely identifies each router operating within the OSPF routing domain.", options: { A: "Process ID", B: "Area ID", C: "Router ID", D: "Interface IP" } },
            { q: "A router has a router ID of 3.3.3.3, others are 1.1.1.1 and 2.2.2.2. With equal priorities, which is elected DR?", ans: "C", exp: "If OSPF router priorities are equal, the router with the highest Router ID is elected Designated Router.", options: { A: "Router 1.1.1.1", B: "Router 2.2.2.2", C: "Router 3.3.3.3", D: "The one that booted first" } },
            { q: "R1 and R2 connect via a point-to-point link. A DR election doesn't occur. Is this expected?", ans: "C", exp: "In a point-to-point link, there are only two routers communicating. There is no need for a DR or BDR.", options: { A: "No, a DR must be elected", B: "Yes, they only elect a DR", C: "Yes, point-to-point links bypass elections", D: "No, elections happen on all links" } },
            { q: "A network administrator changes the router priority on a multiaccess network. What is the reason?", ans: "C", exp: "Router priority (0-255) is the primary tiebreaker in OSPF elections to manually select the DR.", options: { A: "To speed up routing", B: "To change the router ID", C: "To influence the DR/BDR election", D: "To assign a new area" } },
            { q: "Which command enables OSPFv2 using router configuration mode?", ans: "C", exp: "This command initializes the OSPF routing process and moves the CLI context into router config mode.", options: { A: "ip ospf process-id", B: "router ospf area-id", C: "router ospf process-id", D: "network ospf process-id" } },
            { q: "What is the valid range of the OSPF process ID?", ans: "D", exp: "When configuring OSPF globally, the locally significant process ID must fall within 1 to 65,535.", options: { A: "0-255", B: "1-1024", C: "0-65,535", D: "1-65,535" } },
            { q: "Which command explicitly configures an OSPF router ID?", ans: "D", exp: "Within OSPF router configuration mode, the router-id command statically assigns the Router ID.", options: { A: "ip router-id rid", B: "ospf router-id rid", C: "id router rid", D: "router-id rid" } },
            { q: "What is the first preference in the OSPF router ID selection order?", ans: "D", exp: "OSPF always prefers a manually configured Router ID over any active physical or loopback IP addresses.", options: { A: "Highest active IP", B: "Lowest active IP", C: "Highest loopback IP", D: "Explicitly configured router ID" } },
            { q: "What is the second method used by Cisco IOS to select the router ID?", ans: "B", exp: "If no explicit Router ID is set, OSPF defaults to the highest IP address on an active loopback interface.", options: { A: "Lowest loopback IP", B: "Highest loopback IP", C: "Highest physical IP", D: "Lowest physical IP" } },
            { q: "Which command enables OSPF on an interface using interface configuration mode?", ans: "C", exp: "Instead of using the global network command, OSPFv2 can be enabled directly on a specific interface.", options: { A: "ospf process-id area area-id", B: "interface ospf process area", C: "ip ospf process-id area area-id", D: "network ospf process area" } },
            { q: "Which OSPF area is used in a single-area OSPF configuration?", ans: "D", exp: "Area 0 is the backbone area. In a single-area OSPF design, all routers must be placed in Area 0.", options: { A: "Area 1", B: "Area 10", C: "Area 100", D: "Area 0" } },
            { q: "Which command suppresses OSPF messages from an interface while still advertising its network?", ans: "C", exp: "The passive-interface command stops OSPF Hello packets from being sent out an interface.", options: { A: "suppress-interface", B: "no-hello-interface", C: "passive-interface", D: "silent-interface" } },
            { q: "Which command displays OSPF neighbor information?", ans: "C", exp: "This standard EXEC command verifies that an OSPF router has successfully formed adjacencies.", options: { A: "show ospf neighbor", B: "show ip neighbor ospf", C: "show ip ospf neighbor", D: "show ip route ospf" } },
            { q: "Which command provides detailed information about an OSPF-enabled interface?", ans: "B", exp: "This command reveals parameters like Area ID, Process ID, Cost, state (DR/BDR), and timer intervals.", options: { A: "show interface ospf", B: "show ip ospf interface", C: "show ospf interface", D: "show ip interface ospf" } },
            { q: "What does a wildcard mask of 0.0.0.0 accomplish when used with an OSPF network command?", ans: "C", exp: "A '0' means the bit must match exactly. 0.0.0.0 restricts OSPF to one single specific interface address.", options: { A: "Matches any IP address", B: "Matches the subnet mask", C: "Matches one exact IPv4 address", D: "Disables OSPF" } },
            { q: "An administrator wants to configure OSPF process 10 on R1. Which command should be entered?", ans: "C", exp: "This initiates the OSPF routing engine and assigns it a locally significant process ID of 10.", options: { A: "ip ospf 10", B: "router ospf area 10", C: "router ospf 10", D: "network ospf 10" } },
            { q: "R1 has an interface 10.1.1.5. Enable OSPF only on that exact interface using the network command.", ans: "C", exp: "To match the exact IP address, the network command must specify the IP with a 0.0.0.0 wildcard mask.", options: { A: "network 10.1.1.5 255.255.255.255 area 0", B: "network 10.1.1.0 0.0.0.255 area 0", C: "network 10.1.1.5 0.0.0.0 area 0", D: "network 10.1.1.5 0.0.0.0 area 10" } },
            { q: "Enable OSPF directly on GigabitEthernet 0/0/0 using process 10 in Area 0. Which command?", ans: "C", exp: "This is the correct interface-level configuration syntax to enable OSPF without the global network command.", options: { A: "router ospf 10 area 0", B: "network 10 area 0", C: "ip ospf 10 area 0", D: "interface ospf 10 area 0" } },
            { q: "Which three goals make up the CIA Triad of network security?", ans: "B", exp: "The CIA Triad (Confidentiality, Integrity, Availability) is the foundational model in cybersecurity.", options: { A: "Control, Integrity, Authentication", B: "Confidentiality, Integrity, Availability", C: "Confidentiality, Identity, Availability", D: "Control, Identity, Authorization" } },
            
            // PART II. True or False
            { q: "Use the router-id rid router configuration mode command to manually assign a router ID.", ans: "True", exp: "The router-id [ip-address] command is the standard method for manually assigning a unique Router ID.", options: { "True": "True", "False": "False" } },
            { q: "When configuring single-area OSPFv2, the network command must use the same area-id on all routers.", ans: "True", exp: "For routers to form adjacencies in a single-area setup, they must all belong to the exact same area (usually Area 0).", options: { "True": "True", "False": "False" } },
            { q: "The basic syntax for the network command is ip ospf process-id area area-id.", ans: "False", exp: "That syntax is for interface-specific config. The global command is: network [address] [wildcard-mask] area [area-id].", options: { "True": "True", "False": "False" } },
            { q: "Remove the network commands using the delete form of the command.", ans: "False", exp: "In Cisco IOS, commands are negated or removed using the 'no' keyword, not 'delete'.", options: { "True": "True", "False": "False" } },
            { q: "OSPFv2 is enabled using the router ospf area-id command.", ans: "False", exp: "OSPFv2 is initialized globally using the process ID, not the area ID. (router ospf process-id).", options: { "True": "True", "False": "False" } }
        ];

        let currentIndex = 0;
        let score = 0;
        let selectedKey = null;
        let isAnswerChecked = false;

        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const actionBtn = document.getElementById('action-btn');
        const explanationBox = document.getElementById('explanation-box');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const quizInterface = document.getElementById('quiz-interface');
        const endScreen = document.getElementById('end-screen');
        const finalScore = document.getElementById('final-score');
        const totalQs = document.getElementById('total-qs');

        totalQs.innerText = allQuestions.length;

        function updateProgress() {
            const progress = (currentIndex / allQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function loadQuestion() {
            if (currentIndex >= allQuestions.length) {
                showEndScreen();
                return;
            }

            const currentQ = allQuestions[currentIndex];
            questionTextEl.innerText = `${currentIndex + 1}. ${currentQ.q}`;
            optionsContainer.innerHTML = '';
            explanationBox.classList.remove('active');
            
            selectedKey = null;
            isAnswerChecked = false;
            
            actionBtn.innerText = 'CHECK';
            actionBtn.className = 'action-btn';
            actionBtn.disabled = true;

            for (const [key, value] of Object.entries(currentQ.options)) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                // Only show the value (e.g. "Tamar" instead of "A. Tamar") to match the design
                btn.innerText = value;
                btn.dataset.key = key;

                btn.onclick = () => selectOption(btn, key);
                optionsContainer.appendChild(btn);
            }
            
            updateProgress();
        }

        function selectOption(btn, key) {
            if (isAnswerChecked) return; // Prevent changing answer after checking

            // Remove selected class from all
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.remove('selected'));

            // Add selected to clicked
            btn.classList.add('selected');
            selectedKey = key;

            // Enable check button
            actionBtn.disabled = false;
            actionBtn.classList.add('ready');
        }

        function handleAction() {
            if (!isAnswerChecked) {
                checkAnswer();
            } else {
                currentIndex++;
                loadQuestion();
            }
        }

        function checkAnswer() {
            const currentQ = allQuestions[currentIndex];
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            
            isAnswerChecked = true;

            allBtns.forEach(b => {
                b.disabled = true; // lock buttons
                const btnKey = b.dataset.key;
                
                // Highlight Correct answer
                if (btnKey === currentQ.ans) {
                    b.classList.add('correct');
                }
                
                // Highlight selected wrong answer
                if (btnKey === selectedKey && selectedKey !== currentQ.ans) {
                    b.classList.add('incorrect');
                }
            });

            // Update Score
            if (selectedKey === currentQ.ans) {
                score++;
                scoreDisplay.innerText = score;
            }

            // Show explanation
            explanationBox.innerHTML = `<span>Explanation:</span>${currentQ.exp}`;
            explanationBox.classList.add('active');

            // Update action button
            actionBtn.innerText = 'NEXT';
            actionBtn.className = 'action-btn next';
        }

        function showEndScreen() {
            quizInterface.style.display = 'none';
            endScreen.style.display = 'flex';
            progressBar.style.width = '100%';
            finalScore.innerText = score;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            scoreDisplay.innerText = '0';
            quizInterface.style.display = 'flex';
            endScreen.style.display = 'none';
            loadQuestion();
        }

        // Initialize first question on load
        window.onload = loadQuestion;
    </script>
</body>
</html>
